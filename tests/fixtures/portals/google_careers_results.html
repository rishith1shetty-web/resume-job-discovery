<!doctype html><html><head><title>Search Jobs — Google Careers</title></head><body><div id="app"></div><script class="ds:0" nonce="fixture">AF_initDataCallback({key: 'ds:0', hash: '1', data:[[["projects/gweb-careers-proto/tenants/60107626-8e00-0000-0000-0071646e0806/companies/5364d68d-d016-48b0-a6ec-0c6fe5032c6c","DeepMind","deepmind"],["projects/gweb-careers-proto/tenants/60107626-8e00-0000-0000-0071646e0806/companies/cf176a1b-8a08-43bb-9ba0-8eaa0fa03a9a","GFiber","gfiber","https://fiber.google.com/","https://fiber.google.com/careers/","https://lh4.googleusercontent.com/-UfnKaj_9Aa4/AAAAAAAAAAI/AAAAAAAAQ1M/44abuxfAOMk/photo.jpg\u003ds60?sz\u003d60"],["projects/gweb-careers-proto/tenants/60107626-8e00-0000-0000-0071646e0806/companies/ebbbf0d1-8121-483c-8f99-ee92597591fc","Google","google"],["projects/gweb-careers-proto/tenants/60107626-8e00-0000-0000-0071646e0806/companies/02f54ba2-2fcc-40df-8c3d-41f5170a8d11","Verily Life Sciences","verily-life-sciences"],["projects/gweb-careers-proto/tenants/60107626-8e00-0000-0000-0071646e0806/companies/21a93a7a-e8bd-44d4-a7ad-480c22177007","Waymo","waymo"],["projects/gweb-careers-proto/tenants/60107626-8e00-0000-0000-0071646e0806/companies/c774ff7a-ba6a-430b-9f1d-a53eb197d842","Wing","wing","https://x.company/projects/wing/","https://x.company/careers-at-x/","https://lh3.googleusercontent.com/-xf27YBaq1Lk/AAAAAAAAAAI/AAAAAAAAFb0/U1uzM1c-GDI/photo.jpg\u003ds60?sz\u003d60"],["projects/gweb-careers-proto/tenants/60107626-8e00-0000-0000-0071646e0806/companies/ad872500-709d-4a93-97e3-76be227f77a1","YouTube","youtube"]]], sideChannel: {}});</script><script class="ds:1" nonce="fixture">AF_initDataCallback({key: 'ds:1', hash: '2', data:[[["122724250615194310","Staff Software Engineer, AI/ML, Google Cloud Security","https://www.google.com/about/careers/applications/signin?jobId=CiUAL2FckXqiTMMC0vl2yYfomLfIWu0w7SKBmaP4h32g5-pLtr7sEjsA1Ny_i4jnT5Q9ifwGqimXkNn4c5KVrqNUZmpo0ySlDPW7YVEhjngkDY2e-m28N9AUwIWiXCys6frovg%3D%3D_V2&loc=US&title=Staff+Software+Engineer",[null,"<ul>\n<li>Provide technical leadership on high-impact projects. Manage project priorities, deadlines, and deliverables.</li>\n<li>Facilitate alignment and clarity across teams on goals, outcomes, and timelines. Influence and coach a distributed team of engineers.</li>\n<li>Lead the design and implementation of solutions in specialized ML areas, optimize ML infrastructure, and guide the development of model optimization and data processing strategies.</li>\n<li>Establish strategic partnerships with stakeholders to define a long-term product outlook and technology roadmap.</li>\n<li>Lead the integration of AI into both product solutions and engineering practices, helping to accelerate AI velocity throughout the organization.</li>\n</ul>"],[null,"<h3>Minimum qualifications:</h3><ul>\n<li>Bachelor’s degree or equivalent practical experience.<br></li>\n<li>8 years of experience in software development.<br></li>\n<li>5 years of experience testing, and launching software products, and 3 years of experience with software design and architecture.</li>\n<li>5 years of experience with ML design and ML infrastructure (e.g., model deployment, model evaluation, data processing, debugging, fine tuning).</li>\n<li>3 years of experience leading technical projects and providing technical leadership to cross-functional teams.</li>\n<li>Experience integrating generative AI tools or LLM interfaces into workflows.</li>\n</ul><br><h3>Preferred qualifications:</h3><ul>\n<li>Master’s degree or PhD in Engineering, Computer Science, or a related technical field.</li>\n<li>3 years of experience in a technical leadership role leading project teams and setting technical direction.</li>\n<li>Experience in highly scalable and available distributed systems, cloud services or data platforms.</li>\n<li>Experience with Generative AI, Agentic AI, and Large Language Models (LLMs).</li>\n<li>Experience with major cloud platforms (e.g., <br>Google Cloud Platform (GCP)).</li>\n<li>Experience in the security domain.</li>\n</ul>"],"projects/gweb-careers-proto/tenants/60107626-8e00-0000-0000-0071646e0806/companies/ebbbf0d1-8121-483c-8f99-ee92597591fc",null,"Google","en-US",[["Reston, VA, USA",["Reston, VA, USA"],"Reston",null,"VA","US"],["New York, NY, USA",["New York, NY, USA"],"New York",null,"NY","US"]],[null,"<p>Google's software engineers develop the next-generation technologies that change how billions of users connect, explore, and interact with information and one another. Our products need to handle information at massive scale, and extend well beyond web search. We're looking for engineers who bring fresh ideas from all areas, including information retrieval, distributed computing, large-scale system design, networking and data storage, security, artificial intelligence, natural language processing, UI design and mobile; the list goes on and is growing every day. As a software engineer, you will work on a specific project critical to Google’s needs with opportunities to switch teams and projects as you and our fast-paced business grow and evolve. We need our engineers to be versatile, display leadership qualities and be enthusiastic to take on new problems across the full-stack as we continue to push technology forward.</p>\n<p>The Defense and Consulting team within Google Cloud Security is on a relentless mission to make organizations secure against cyber threats, confident in their readiness, and know they are never alone. Our team is passionate about giving the defender's advantage to find evil in the most advanced attacks, being incredibly efficient in their work, and leveraging best in class technologies and threat intelligence. We are at the forefront of the Agentic SOC outlook, revolutionizing how organizations defend against emerging threats, accelerating customer time-to-value, and optimizing security workflows. If you are obsessed with helping organizations become more secure, enabling security analysts and threat hunters to do their work in the best way possible, and are excited about building and introducing new technologies - this can be the role for you.</p><p>The AI and Infrastructure team is redefining what’s possible. We empower Google customers with breakthrough capabilities and insights by delivering AI and Infrastructure at unparalleled scale, efficiency, reliability and velocity. Our customers include Googlers, Google Cloud customers, and billions of Google users worldwide. </p><p>We're the driving force behind Google's groundbreaking innovations, empowering the development of our cutting-edge AI models, delivering unparalleled computing power to global services, and providing the essential platforms that enable developers to build the future. From software to hardware our teams are shaping the future of world-leading hyperscale computing, with key teams working on the development of our TPUs, Vertex AI for Google Cloud, Google Global Networking, Data Center operations, systems research, and much more.</p><b></b>Individual pay is determined by factors including job-related skills, experience, and relevant education or training.  <br><br>US: $207000 - $301000 (USD) + 20% bonus target + equity + benefits<br><br>Learn more about <a href=\"https://www.google.com/about/careers/applications/benefits/\" target=\"_blank\">benefits at Google</a>."],[2,3,4],[1783933876,377000000],[1787068012,572000000],[1787068012,746000000],[null,"In most instances, this position requires in-person interviews as part of the hiring process."],null,null,[null,"Note: By applying to this position you will have an opportunity to share your preferred working location from the following: <b>Reston, VA, USA; New York, NY, USA</b>."],[null,"<ul>\n<li>Bachelor’s degree or equivalent practical experience.<br></li>\n<li>8 years of experience in software development.<br></li>\n<li>5 years of experience testing, and launching software products, and 3 years of experience with software design and architecture.</li>\n<li>5 years of experience with ML design and ML infrastructure (e.g., model deployment, model evaluation, data processing, debugging, fine tuning).</li>\n<li>3 years of experience leading technical projects and providing technical leadership to cross-functional teams.</li>\n<li>Experience integrating generative AI tools or LLM interfaces into workflows.</li>\n</ul>"],3],["121081200138691270","Strategy Associate, YouTube","https://www.google.com/about/careers/applications/signin?jobId=CiUAL2FckeC51rQa261zKBSyV6Su31WAWpT_4uYZded3xqCta7_LEjsA1Ny_i_x41krXYnqC9DZg0_19NDoWBbiemLP5VoHXBZ3P3CrXGBZO0-wxo0ZCkPs7wF_DXwZOyaLUUw%3D%3D_V2&loc=US&title=Strategy+Associate",[null,"<ul>\n<li><span>Break down problems with frameworks and detailed action plans.</span></li>\n<li><span>Perform quantitative analysis (e.g., sophisticated financial modeling, SQL queries) and qualitative analysis (e.g., analyzing key trends).</span></li>\n<li><span>Articulate information through compelling verbal and written reports, and presentations tailored to a variety of audiences across levels of management and functions.</span></li>\n<li><span>Cultivate relationships with teams, and influence cross-functionally to achieve shared objectives.</span></li>\n<li><span>Advocate the culture through embodying a learning mentality, an ownership mindset, and strong teamwork orientation.</span></li>\n</ul>"],[null,"<h3>Minimum qualifications:</h3><ul>\n<li>Bachelor's degree in a business or quantitative discipline (e.g., Business Administration, Statistics, Economics, Mathematics, Physics) or equivalent practical experience.</li>\n<li>3 years of experience in management consulting or other equivalent business strategy experience.<br></li>\n<li>Experience in analytics.</li>\n</ul><br><h3>Preferred qualifications:</h3><ul>\n<li>Experience communicating and influencing a range of audiences, including executives.</li>\n<li>Experience with financial modeling, SQL, and data visualization.</li>\n<li>Experience working in tech or media industries.</li>\n<li>Excellent problem-solving, analytical, financial modeling, and presentation skills.</li>\n<li>Exceptional business judgement and demonstrated impact in large-scale strategic initiatives.</li>\n</ul>"],"projects/gweb-careers-proto/tenants/60107626-8e00-0000-0000-0071646e0806/companies/ad872500-709d-4a93-97e3-76be227f77a1",null,"YouTube","en-US",[["San Bruno, CA, USA",["901 Cherry Ave, San Bruno, CA 94066, USA"],"San Bruno","94066","CA","US"]],[null,"<p>The YouTube Strategy, Analytics and Finance team’s mission is to make YouTube more valuable by identifying and steering the business towards the biggest opportunities, guiding the organization to make the best possible decisions and enabling effective implementation. Within this group, the Strategy team works at the center of the action partnering directly with executive level product management leaders who serve as our key stakeholders to drive high-impact, platform-wide strategic decisions.</p><p>The team owns projects that shape the future of YouTube, driving recommendations on new trends, opportunities, and challenges from responses to major industry shifts like generative AI and short-form video, to driving growth from new business models like shopping and subscriptions, to responsibly managing the creator ecosystem, and more.  <br><br>As a Strategy Associate for YouTube, you will drive our team’s initiatives forward with the coaching and mentorship of principals and directors: structuring ambiguous problems, deeply researching the engaged landscape, building models, and analyzing complex data to synthesize executive-ready recommendations. You will operate as a generalist, applying your strategy toolkit to a varied range of projects across YouTube’s product and business areas. Your work will directly shape company strategy and catalyze successful launches with cross-functional teams. You'll work side-by-side with executive stakeholders across Product, Engineering, Business, Partnerships, Marketing, Sales, and more. In addition, you will be an integral part of the Strategy team’s tight-knit community and culture.</p><p><b></b></p>Individual pay is determined by factors including job-related skills, experience, and relevant education or training.  <br><br>US: $118000 - $169000 (USD) + 15% bonus target + equity + benefits<br><br>Learn more about <a href=\"https://www.google.com/about/careers/applications/benefits/\" target=\"_blank\">benefits at Google</a>."],[2],[1785508798,416000000],[1786974136,348000000],[1786974136,437000000],[null,""],null,null,[null,""],[null,"<ul>\n<li>Bachelor's degree in a business or quantitative discipline (e.g., Business Administration, Statistics, Economics, Mathematics, Physics) or equivalent practical experience.</li>\n<li>3 years of experience in management consulting or other equivalent business strategy experience.<br></li>\n<li>Experience in analytics.</li>\n</ul>"],2],["128047698732294854","Global Solutions Senior Associate, Go-To-Market","https://www.google.com/about/careers/applications/signin?jobId=CiUAL2FckRywD5i9LoAxHuexlhD9yBmBf5la9BC3Sf9oDd8gg3vKEjsAvkGZm4THp3qlwsaUa9eoAxCW2Be1UIPZ6t-5OlkCaveyVoUtSwm3Y89fiqLLdIoFh_BBSrVSi7F0Zw%3D%3D_V2&loc=US&title=Global+Solutions+Senior+Associate",[null,"<ul>\n<li>Collaborate with Google sales teams to identify potential business growth opportunities.</li>\n<li>Gather information on common objections, successful strategies, product knowledge gaps, and more.</li>\n<li>Work closely with sales and global team leaders to develop effective narratives. Leverage resources to equip sellers with in-depth product knowledge and expertise.</li>\n<li>Share customer and product feedback with central and product teams to ensure the product roadmap aligns with the needs of the sales organization, promoters and customers. Collaborate with Sales and go-to-market teams to identify key challenges, unlock growth opportunities, and develop scalable solutions across industry challenges.</li>\n<li>Partner with Product Management and central teams to influence product roadmaps and ensure they reflect the needs of our customers. Monitor and report on key drivers/metrics. Facilitate and run internal and external trainings. Introduce/pitch priority products to strategic customers.</li>\n</ul>"],[null,"<h3>Minimum qualifications:</h3><ul>\n<li>Bachelor's degree or equivalent practical experience.<br></li>\n<li>4 years of experience in product management, marketing, management consulting, or project management in technology.<br></li>\n<li>Experience working with Engineering, Product teams, or executive leadership.</li><li>Experience developing business strategies or managing cross-functional initiatives.</li>\n</ul><br><h3>Preferred qualifications:</h3><ul>\n<li>Experience partnering with clients on technical products (e.g., pitching solutions, consulting, project management, implementation, demonstrating products, or technical sales).</li>\n<li>Experience managing complex projects with stakeholders across multiple functions.</li><li>Experience with Google Ads products.</li>\n<li>Strategic thinking and problem solving skills with demonstrated ability to lead complex operational and strategic initiatives.</li>\n<li>Exceptional ability to structure a compelling storyline and build presentation decks/documents to support their position.</li>\n<li>Excellent communication skills.</li>\n</ul>"],"projects/gweb-careers-proto/tenants/60107626-8e00-0000-0000-0071646e0806/companies/ebbbf0d1-8121-483c-8f99-ee92597591fc",null,"Google","en-US",[["New York, NY, USA",["New York, NY, USA"],"New York",null,"NY","US"],["Los Angeles, CA, USA",["Los Angeles, CA, USA"],"Los Angeles",null,"CA","US"],["San Francisco, CA, USA",["San Francisco, CA, USA"],"San Francisco",null,"CA","US"],["Chicago, IL, USA",["Chicago, IL, USA"],"Chicago",null,"IL","US"],["Mountain View, CA, USA",["Mountain View, CA, USA"],"Mountain View",null,"CA","US"],["Ann Arbor, MI, USA",["Ann Arbor, MI, USA"],"Ann Arbor",null,"MI","US"],["United States",["United States"],null,null,null,"US"]],[null,"Businesses of all shapes and sizes rely on Google’s unparalleled advertising solutions to help them grow in today's dynamic marketing environment. You bring a passion for sales, knowledge of online media, and commitment to maximize customer success. You act like an owner, move with velocity through change, finding innovative and strategic ways to consistently deliver extraordinary and incremental outcomes for both Google and your customers. You build trusted relationships with customers, uncovering their business needs and translating them into powerful solutions to achieve their most ambitious goals. You achieve as a team with sellers, shape the future of advertising in the AI-era, and make a real impact on the millions of companies and billions of users that trust Google with their most important goals.\nIndividual pay is determined by factors including job-related skills, experience, and relevant education or training.  <br><br>US: $124000 - $178000 (USD) + 15% bonus target + equity + benefits<br><br>Learn more about <a href=\"https://www.google.com/about/careers/applications/benefits/\" target=\"_blank\">benefits at Google</a>."],[2],[1769634196,675000000],[1786968679,101000000],[1786968679,674000000],[null,"<p>This role may also be located in our Playa Vista, CA campus.</p><p>Applicants in the County of Los Angeles: Qualified applications with arrest or conviction records will be considered for employment in accordance with the Los Angeles County Fair Chance Ordinance for Employers and the California Fair Chance Act.<br></p>Applicants in San Francisco: Qualified applications with arrest or conviction records will be considered for employment in accordance with the San Francisco Fair Chance Ordinance for Employers and the California Fair Chance Act.<br><br>The application window will be open until at least August 31, 2026. This opportunity will remain online based on business needs which may be before or after the specified date."],1,null,[null,"Note: By applying to this position you will have an opportunity to share your preferred working location from the following:<br><br><b>In-office locations: New York, NY, USA; Los Angeles, CA, USA; San Francisco, CA, USA; Chicago, IL, USA; Mountain View, CA, USA; Ann Arbor, MI, USA.</b><br><b>Remote location(s): United States.</b>"],[null,"<ul>\n<li>Bachelor's degree or equivalent practical experience.<br></li>\n<li>4 years of experience in product management, marketing, management consulting, or project management in technology.<br></li>\n<li>Experience working with Engineering, Product teams, or executive leadership.</li><li>Experience developing business strategies or managing cross-functional initiatives.</li>\n</ul>"],2],["121773752340882118","Strategy and Operations Senior Associate","https://www.google.com/about/careers/applications/signin?jobId=CiUAL2FckSSUrHHF8eARqCVZefJixcIyfDboyNaQeyV8qAenkxPAEjsA1Ny_iysqMFkolvQLNxCtjHQdAZYGlL_mNPK_Nq8ozq0lzq1wjIyAD5CPXAeQLVkKFj2v-mecXkUFUQ%3D%3D_V2&loc=US&title=Strategy+and+Operations+Senior+Associate",[null,"<ul>\n<li>Draw interpretable insights from sophisticated business analyses and advanced modeling.<br></li>\n<li>Design processes, tools, and operating cadences to achieve organizational outcomes.<br></li>\n<li>Develop comprehensive sales, product or business strategies that solve complex business challenges and address the needs of customers and stakeholders across various functions to drive incremental growth.<br></li>\n<li>Communicate data-driven recommendations to leadership and to the broader organization by preparing polished presentations and identifying key takeaways.<br></li>\n<li>Define actionable plans and roadmaps and align cross-functional stakeholders to drive successful implementation of change initiatives.<br></li>\n</ul>"],[null,"<h3>Minimum qualifications:</h3><ul>\n<li>Bachelor's degree or equivalent practical experience.<br></li>\n<li>4 years of experience in a management consulting, sales operations, business strategy or corporate advisory role.</li>\n<li>2 years of experience working with executive stakeholders.<br></li>\n<li>2 years of experience developing business strategies or managing cross-functional initiatives.<br></li>\n</ul><br><h3>Preferred qualifications:</h3><ul>\n<li>2 years of experience generating insights from analysis on large data sets to drive business decisions.<br></li>\n<li>Experience collaborating with multiple stakeholders across organizational boundaries.<br></li>\n<li>Experience in advertising, consultative sales, business development, or a digital media environment for a complex organization.<br></li>\n<li>Structured problem solving skills, combined with strong business acumen.<br></li>\n<li>Excellent communication and presentation skills with the ability to take complex, ambiguous topics and turn them into compelling narratives for different audiences. <br></li>\n</ul>"],"projects/gweb-careers-proto/tenants/60107626-8e00-0000-0000-0071646e0806/companies/ebbbf0d1-8121-483c-8f99-ee92597591fc",null,"Google","en-US",[["New York, NY, USA",["New York, NY, USA"],"New York",null,"NY","US"],["Ann Arbor, MI, USA",["Ann Arbor, MI, USA"],"Ann Arbor",null,"MI","US"],["Mountain View, CA, USA",["Mountain View, CA, USA"],"Mountain View",null,"CA","US"],["San Francisco, CA, USA",["San Francisco, CA, USA"],"San Francisco",null,"CA","US"]],[null,"<p>The GCS Sales and Strategy teams provide business critical insights using analytics, ensure cross-functional alignment of goals and execution, help teams drive strategic partnerships and new initiatives forward, and drive sustainable business growth and product adoption. We stay focused on aligning the highest-level company priorities with effective day-to-day operations, and help evolve early stage ideas into future-growth initiatives. Team members are experienced in business strategy and operations, analytical and strategic, yet highly pragmatic and results-oriented.</p><p>Google Customer Solutions (GCS) sales teams are trusted advisors and competitive sellers who maintain a relentless focus on customer success by bringing the best Google has to offer to small- and medium-sized businesses (SMBs), which are the backbone of our communities. As a member of our team, you’ll have the opportunity to work with company owners and make a real difference in their businesses by helping them grow.  Together, we help shape the future of innovation for customers, partners, and sellers...and we have fun doing it.</p>Individual pay is determined by factors including job-related skills, experience, and relevant education or training.  <br><br>US: $124000 - $177000 (USD) + 15% bonus target + equity + benefits<br><br>Learn more about <a href=\"https://www.google.com/about/careers/applications/benefits/\" target=\"_blank\">benefits at Google</a>."],[2],[1787074971,706000000],[1787074971,706000000],[1787074971,748000000],[null,"Applicants in San Francisco: Qualified applications with arrest or conviction records will be considered for employment in accordance with the San Francisco Fair Chance Ordinance for Employers and the California Fair Chance Act."],null,null,[null,"Note: By applying to this position you will have an opportunity to share your preferred working location from the following: <b>New York, NY, USA; Ann Arbor, MI, USA; Mountain View, CA, USA; San Francisco, CA, USA</b>."],[null,"<ul>\n<li>Bachelor's degree or equivalent practical experience.<br></li>\n<li>4 years of experience in a management consulting, sales operations, business strategy or corporate advisory role.</li>\n<li>2 years of experience working with executive stakeholders.<br></li>\n<li>2 years of experience developing business strategies or managing cross-functional initiatives.<br></li>\n</ul>"],2],["110674732214297286","Research and Development Analyst, Trust and Safety Monetization","https://www.google.com/about/careers/applications/signin?jobId=CiUAL2FckbyNV2z_ezFO7GUpLS6wc3KFQZEHTLVD1P5k8fLksDR6EjsA1Ny_i7mBUANHVfH_lMeLI1MhfLmvQgqdLBlLn2k5twvFQgZNHwJI3EF7XsImFsOyLmSDIbVCUDH0fg%3D%3D_V2&loc=US&title=Research+and+Development+Analyst",[null,"<ul>\n<li>Perform analysis and investigations using a variety of data sources and take enforcement actions to identify and defend novel fraud and abuse on Google's ad products.</li>\n<li>Partner closely with engineering teams to improve ad traffic infrastructure, defense systems, and workflows. Proactively identify and help implement efficiency improvements through advanced machine learning techniques, scaled defenses, and automation. </li>\n<li>Drive full lifecycle projects across product, engineering, and trust and safety teams to prevent abuse by improving policies and closing product vulnerabilities.</li>\n<li>Work collaboratively with teammates around the globe and deliver projects from beginning to end in a timely manner.</li>\n<li>Be exposed to potentially sensitive content or situations and possibly graphic, controversial, and/or upsetting topics or content as part of the role.</li>\n</ul>"],[null,"<h3>Minimum qualifications:</h3><ul>\n<li>Bachelor's degree or equivalent practical experience.<br></li>\n<li>2 years of experience in data analysis, including identifying trends, generating summary statistics, and drawing insights from quantitative and qualitative data.<br></li>\n<li>2 years of experience with statistical and quantitative modeling or fraud and risk management.</li>\n</ul><br><h3>Preferred qualifications:</h3><ul>\n<li>Experience in the digital advertising industry in a technical role.</li>\n<li>Experience delivering experimental research or security and reverse engineering.</li>\n<li>Experience applying ML/AI in industry settings.</li>\n<li>Excellent communication and collaboration skills to communicate technical concepts with and influence cross-regional and cross-functional stakeholders at all levels.</li>\n<li>Excellent problem-solving and critical thinking skills with attention to detail in an ever-changing environment.</li>\n</ul>"],"projects/gweb-careers-proto/tenants/60107626-8e00-0000-0000-0071646e0806/companies/ebbbf0d1-8121-483c-8f99-ee92597591fc",null,"Google","en-US",[["Kirkland, WA, USA",["Kirkland, WA, USA"],"Kirkland",null,"WA","US"]],[null,"The mission of our team is to build an exceptional trusted ads ecosystem by predicting and mitigating emerging risks, ensuring safe and healthy growth for creators, publishers, advertisers, and end users.<br><br>We defend Google's ad products from fraud and abuse. We evaluate millions of publishers, analyze billions of events, and create scalable methods to stop bad actors and motivated fraudsters from causing harm. We understand the user's point of view and are passionate about using our technical, sales, and customer service acumen to protect them. When we get this right, we help users, advertisers, publishers, and Google harness information and monetize the internet safely and usefully.<div><br>As a Research and Development Analyst on the Trust and Safety Monetization team, you'll be responsible for future-proofing Google's ad ecosystem from invalid traffic and abuse. You'll work to discover abuse trends and signatures, take risks to seek out and deeply understand the unknown, and then share findings and concrete recommendations with our partner teams. You will collaborate with internal and external stakeholders to develop and improve our defenses, because we don't succeed unless they do.</div>Individual pay is determined by factors including job-related skills, experience, and relevant education or training.  <br><br>US: $132000 - $189000 (USD) + 15% bonus target + equity + benefits<br><br>Learn more about <a href=\"https://www.google.com/about/careers/applications/benefits/\" target=\"_blank\">benefits at Google</a>."],[2],[1787065707,732000000],[1787065707,732000000],[1787065707,803000000],[null,"In accordance with Washington state law, we are highlighting our comprehensive benefits package, which is available to all eligible US based employees. Benefits for this role include:<br><ul><li>Health, dental, vision, life, disability insurance</li><li>Retirement Benefits: 401(k) with company match</li><li>Paid Time Off: 20 days of vacation per year, accruing at a rate of 6.15 hours per pay period for the first five years of employment</li><li>Sick Time: 40 hours/year (increased to 69 hours/year for Seattle) including 5 discretionary sick days per instance </li><li>Maternity Leave (Short-Term Disability + Baby Bonding): 28-30 weeks</li><li>Baby Bonding Leave: 18 weeks</li><li>Holidays: 13 paid days per year</li></ul>"],null,null,[null,""],[null,"<ul>\n<li>Bachelor's degree or equivalent practical experience.<br></li>\n<li>2 years of experience in data analysis, including identifying trends, generating summary statistics, and drawing insights from quantitative and qualitative data.<br></li>\n<li>2 years of experience with statistical and quantitative modeling or fraud and risk management.</li>\n</ul>"],2],["130446150304965318","Engineering Analyst, Trust and Safety, Egregious Harms","https://www.google.com/about/careers/applications/signin?jobId=CiUAL2FckXIgKRck1C6oRklEFboDSrZ7-LG4nZfSJ5smDgX-QQIvEjsA1Ny_i5uoRWCy5_q3ysZStCpGl84Dhv-8Av_OtNFfuAFJACUu1ZIA_E_hcqQGwxwEbwlhId4u8xU-jQ%3D%3D_V2&loc=US&title=Engineering+Analyst",[null,"<ul>\n<li>Perform data analyses to derive insights that help identify emerging threats and fight abuse across our products.</li>\n<li>Identify opportunities for the improvement of Google’s detection and enforcement systems as well as for automation.</li>\n<li>Lead multiple interdependent projects of moderate to high complexity and scope, coordinating cross-functionally to ensure alignment on objectives and key results.</li>\n<li>Analyze statistics (e.g., precision, recall) about the performance of technical models (ML systems, classifiers, Large Language Model (LLMs) and recognize nuanced, easily missed problems in the performance of these systems.</li>\n<li>Review or be exposed to sensitive or graphic content as part of core role.</li>\n</ul>"],[null,"<h3>Minimum qualifications:</h3><ul>\n<li>Bachelor's degree or equivalent practical experience.<br></li>\n<li>2 years of experience in data analysis, including identifying trends, generating summary statistics, and drawing insights from quantitative and qualitative data.<br></li>\n<li>Experience with one or more of the following languages: SQL or Python.</li>\n</ul><br><h3>Preferred qualifications:</h3><ul>\n<li>Master's degree in a quantitative discipline.<br></li>\n<li>Experience with scripting language, machine learning tools, techniques and systems (including large language models).</li>\n<li>Knowledge of current abuse techniques and practices.</li>\n<li>Ability to work with a variety of stakeholders to gather requirements, explain models, and iterate to make improvements.</li>\n<li>Excellent problem-solving and critical thinking skills with attention to detail in an ever-changing environment.</li>\n<li>Excellent communication with an ability to describe technical implementations or analyses to a non-tech audience.</li>\n</ul>"],"projects/gweb-careers-proto/tenants/60107626-8e00-0000-0000-0071646e0806/companies/ebbbf0d1-8121-483c-8f99-ee92597591fc",null,"Google","en-US",[["Washington D.C., DC, USA",["Washington, DC, USA"],"Washington",null,"DC","US"]],[null,"Trust and Safety team members are tasked with identifying and taking on the biggest problems that challenge the safety and integrity of our products. They use technical know-how, excellent problem-solving skills, user insights, and proactive communication to protect users and our partners from abuse across Google products like Search, Maps, Gmail, and Google Ads. On this team, you're a big-picture thinker and strategic team-player with a passion for doing what’s right. You work globally and cross-functionally with Google engineers and product managers to identify and fight abuse and fraud cases at Google speed - with urgency. And you take pride in knowing that every day you are working hard to promote trust in Google and ensuring the highest levels of user safety. <br><br>As an Engineering Analyst within the Trust and Safety team, you will be part of a global team that ensures the seamless detection and enforcement of some of the most egregious online harms (e.g., child sexual abuse materials, non-consensual intimate imagery, violent extremism). Through close partnerships with Product, Engineering, Policy, and Legal, you will leverage your technical acumen to design and develop novel solutions to further Google’s ability to fight this abuse worldwide.At Google we work hard to earn our users’ trust every day. Trust and Safety is Google’s team of abuse fighting and user trust experts working daily to make the internet a safer place. We partner with teams across Google to deliver bold solutions in abuse areas such as malware, spam and account hijacking. A team of Analysts, Policy Specialists, Engineers, and Program Managers, we work to reduce risk and fight abuse across all of Google’s products, protecting our users, advertisers, and publishers across the globe in over 40 languages.Individual pay is determined by factors including job-related skills, experience, and relevant education or training.  <br><br>US: $132000 - $189000 (USD) + 15% bonus target + equity + benefits<br><br>Learn more about <a href=\"https://www.google.com/about/careers/applications/benefits/\" target=\"_blank\">benefits at Google</a>."],[2,3],[1787062341,245000000],[1787062341,245000000],[1787062341,353000000],[null,""],null,null,[null,""],[null,"<ul>\n<li>Bachelor's degree or equivalent practical experience.<br></li>\n<li>2 years of experience in data analysis, including identifying trends, generating summary statistics, and drawing insights from quantitative and qualitative data.<br></li>\n<li>Experience with one or more of the following languages: SQL or Python.</li>\n</ul>"],2],["92383050616185542","Senior Financial Analyst, Financial Planning and Analysis, Technical Infrastructure","https://www.google.com/about/careers/applications/signin?jobId=CiUAL2FckTdu4vFgywPtL833quwZohKPDjN01rXvZxyt9Spjo3V5EjsA1Ny_iyi3ouYfYQB5yQXqe2Ul6QW3X06qyQqwOuNcPPEd2CVZMf1o5TV1wbDl7jNGS8P9lklHqpZJKw%3D%3D_V2&loc=US&title=Senior+Financial+Analyst",[null,"<ul>\n<li>Partner with multiple stakeholders across technical infrastructure and Google Product Area teams to drive explainable and allocation frameworks.</li>\n<li>Lead monthly finance reviews of financial trends, synthesizing complex data into actionable insights for executive audiences.</li>\n<li>Drive cross-functional projects across Corp Finance and Engineers to enhance technical infrastructure spend reporting and contribute to key initiatives that impact Alphabet's financials.</li>\n<li>Develop and analyze complex infrastructure spend to support initiatives.</li>\n<li>Serve as a leader on the technical infrastructure Financial Planning and Analysis (FP&amp;A) team, mentoring team members and serving as a trusted advisor.</li>\n</ul>"],[null,"<h3>Minimum qualifications:</h3><ul>\n<li>Bachelor's degree in Business, Finance, Economics, Statistics, or another quantitative field, or equivalent practical experience.</li>\n<li>7 years of experience in financial planning and analysis (FP&amp;A), consulting, or a related function, or 5 years with a relevant advanced degree.</li>\n</ul><br><h3>Preferred qualifications:</h3><ul>\n<li>Experience in Finance, Consulting, Corporate Strategy, or a similar function.</li>\n<li>Ability to communicate, influence, and form working relationships with business partners across various levels.</li>\n<li>Ability to take initiative and self-direct work in an unstructured environment. Comfortable managing with ambiguity.</li>\n<li>Excellent investigative and financial modeling skills, including comfort with SQL and managing complex datasets.</li>\n</ul>"],"projects/gweb-careers-proto/tenants/60107626-8e00-0000-0000-0071646e0806/companies/ebbbf0d1-8121-483c-8f99-ee92597591fc",null,"Google","en-US",[["Sunnyvale, CA, USA",["Sunnyvale, CA, USA"],"Sunnyvale",null,"CA","US"]],[null,"<p>Financial Analysts ensure that Google makes sound financial decisions. As a Financial Analyst, your work, whether it's modeling business scenarios or tracking performance metrics, is used by our leaders to make strategic company decisions. While working on multiple projects at a time, you are focused on the details while finding creative ways to solve big picture challenges.</p>\n<p>The name Google came from \"googol,\" a mathematical term for the number 1 followed by 100 zeros. And nobody at Google loves big numbers like the Finance team when providing in depth analysis on all manner of strategic decisions across Google products. From developing forward-thinking analysis to generating management reports to scaling our automated financial processes, the Finance organization is an important partner and advisor to the business.</p>Individual pay is determined by factors including job-related skills, experience, and relevant education or training.  <br><br>US: $141000 - $205000 (USD) + 15% bonus target + equity + benefits<br><br>Learn more about <a href=\"https://www.google.com/about/careers/applications/benefits/\" target=\"_blank\">benefits at Google</a>."],[2],[1787058932,41000000],[1787058932,41000000],[1787058932,127000000],[null,""],null,null,[null,""],[null,"<ul>\n<li>Bachelor's degree in Business, Finance, Economics, Statistics, or another quantitative field, or equivalent practical experience.</li>\n<li>7 years of experience in financial planning and analysis (FP&amp;A), consulting, or a related function, or 5 years with a relevant advanced degree.</li>\n</ul>"],2]],null,99,20], sideChannel: {}});</script></body></html>
