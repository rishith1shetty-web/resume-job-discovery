[project]
name = "jobfinder"
version = "0.1.0"
description = "Resume-based multi-portal job discovery and manual application tracking platform"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "structlog>=24.4.0",
    # Phase 2: resume upload and text extraction.
    "python-multipart>=0.0.20",  # required by FastAPI for multipart uploads
    "pymupdf>=1.24.0",           # PDF text extraction (AGPL-3.0)
    "python-docx>=1.1.0",        # DOCX text extraction
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error::DeprecationWarning:app.*"]
markers = [
    "db: test requires a live PostgreSQL database (set TEST_DATABASE_URL)",
]
