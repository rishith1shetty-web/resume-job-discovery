[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os

# The URL is supplied at runtime by migrations/env.py from app settings, so it
# is never duplicated (or leaked) here.
sqlalchemy.url =

# Timestamped, readable revision filenames.
# `timezone` is intentionally unset: resolving it needs a tz database that
# Windows Python does not ship, and adding `tzdata` purely to stamp filenames
# is not worth a dependency. Filenames use local time; revision ordering comes
# from down_revision, not the name.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
